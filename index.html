<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAIXO — NGL SPAMMER (MINIMAL)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        /* Custom scrollbar for terminal */
        #terminal::-webkit-scrollbar { width: 4px; }
        #terminal::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* Matrix effect fade */
        #matrixCanvas {
            position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.05;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <canvas id="matrixCanvas"></canvas>

    <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden">
        <div class="px-8 pt-8 pb-6 text-center">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">FAIXO NGL</h1>
            <p class="text-sm text-slate-400 mt-1 uppercase tracking-widest font-semibold">Minimalist Spammer</p>
        </div>

        <div class="px-8 space-y-5">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">Username</label>
                <input type="text" id="username" placeholder="target_user" 
                    class="w-full mt-1 px-4 py-3 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none text-slate-700">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">Message</label>
                <textarea id="message" rows="3" placeholder="Write your message..." 
                    class="w-full mt-1 px-4 py-3 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none text-slate-700 resize-none"></textarea>
            </div>
        </div>

        <div class="px-8 mt-6 grid grid-cols-2 gap-4">
            <div class="bg-slate-50 p-4 rounded-2xl">
                <label class="text-[10px] font-bold text-slate-400 uppercase">Count</label>
                <input type="number" id="count" value="10" 
                    class="w-full bg-transparent border-none outline-none font-bold text-lg text-indigo-600 p-0">
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl">
                <label class="text-[10px] font-bold text-slate-400 uppercase">Delay (sec)</label>
                <input type="number" id="delay" value="0.5" step="0.1" 
                    class="w-full bg-transparent border-none outline-none font-bold text-lg text-indigo-600 p-0">
            </div>
        </div>

        <div class="px-8 mt-6 flex gap-3">
            <button id="startBtn" class="flex-1 bg-slate-900 hover:bg-indigo-600 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-indigo-200 active:scale-95">
                RUN ATTACK
            </button>
            <button id="stopBtn" disabled class="px-6 bg-slate-100 text-slate-400 font-bold py-4 rounded-2xl transition-all disabled:opacity-50">
                STOP
            </button>
        </div>

        <div class="px-8 mt-6 flex justify-between items-center">
            <div id="statusLabel" class="text-xs font-bold text-slate-400 animate-pulse uppercase">System Ready</div>
            <div class="flex gap-4 text-xs font-bold">
                <span class="text-emerald-500">SENT: <span id="sentCount">0</span></span>
                <span class="text-rose-500">FAIL: <span id="failCount">0</span></span>
            </div>
        </div>

        <div id="terminal" class="mx-8 my-6 h-32 bg-slate-900 rounded-2xl p-4 overflow-y-auto shadow-inner">
            <div id="logOutput" class="mono text-[10px] text-indigo-300 space-y-1">
                <div>[SYSTEM] Initialized minimal engine...</div>
            </div>
        </div>
        
        <div class="bg-slate-50 py-3 text-center">
            <p class="text-[10px] text-slate-300 font-medium">FOR EDUCATIONAL PURPOSES ONLY</p>
        </div>
    </div>

    <script>
        // --- MATRIX BACKGROUND (Light version) ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const columns = Math.floor(canvas.width / 20);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(248, 250, 252, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#cbd5e1";
            ctx.font = "15px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = Math.floor(Math.random() * 2);
                ctx.fillText(text, i * 20, drops[i] * 20);
                if (drops[i] * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // --- SPAMMER LOGIC ---
        let isRunning = false;
        let sent = 0;
        let failed = 0;

        function addLog(msg, colorClass = '') {
            const logOutput = document.getElementById('logOutput');
            const entry = document.createElement('div');
            entry.className = colorClass;
            entry.innerHTML = `> ${msg}`;
            logOutput.appendChild(entry);
            document.getElementById('terminal').scrollTop = document.getElementById('terminal').scrollHeight;
        }

        async function postMessage(username, question) {
            const url = "https://ngl.link/api/submit";
            const body = new URLSearchParams({
                username: username,
                question: question,
                deviceId: 'ea4576ad-d3d4-4c4d-9b4c-3c8c9c8c9c8c',
                gameSlug: '',
                referrer: ''
            });

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: body,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                return response.ok;
            } catch (err) { return false; }
        }

        document.getElementById('startBtn').onclick = async () => {
            const user = document.getElementById('username').value.trim();
            const msg = document.getElementById('message').value.trim();
            const count = parseInt(document.getElementById('count').value);
            const delay = parseFloat(document.getElementById('delay').value) * 1000;

            if (!user || !msg) return alert("Please fill all fields");

            isRunning = true;
            sent = 0; failed = 0;
            document.getElementById('sentCount').innerText = '0';
            document.getElementById('failCount').innerText = '0';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('stopBtn').classList.replace('text-slate-400', 'text-rose-500');
            document.getElementById('statusLabel').innerText = "Attacking...";
            
            addLog(`TARGET LOCKED: ${user}`, 'text-indigo-400 font-bold');

            for (let i = 0; i < count; i++) {
                if (!isRunning) break;

                const success = await postMessage(user, msg);
                if (success) {
                    sent++;
                    document.getElementById('sentCount').innerText = sent;
                    addLog(`PACKET #${i+1} SENT`, 'text-emerald-400');
                } else {
                    failed++;
                    document.getElementById('failCount').innerText = failed;
                    addLog(`PACKET #${i+1} FAILED`, 'text-rose-400');
                }

                if (i < count - 1 && isRunning) await new Promise(r => setTimeout(r, delay));
            }

            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('stopBtn').classList.replace('text-rose-500', 'text-slate-400');
            document.getElementById('statusLabel').innerText = "System Idle";
            addLog("OPERATION FINISHED");
        };

        document.getElementById('stopBtn').onclick = () => {
            isRunning = false;
            addLog("STOP SIGNAL RECEIVED", "text-rose-500 font-bold");
        };
    </script>
</body>
</html>
